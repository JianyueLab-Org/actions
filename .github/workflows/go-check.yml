name: Go Check

on:
  workflow_call:
    inputs:
      go-version:
        description: Go version to use
        type: string
        required: false
        default: "1.24"
      working-directory:
        description: Working directory (for monorepos)
        type: string
        required: false
        default: "."
      run-tests:
        description: Whether to run go test
        type: boolean
        required: false
        default: true

jobs:
  # GitHub-hosted runner by default. When it cannot start, jobs run on the caller org's self-hosted runner.
  runner:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions: {}
    outputs:
      hosted: ${{ steps.probe.outputs.hosted }}
    steps:
      - id: probe
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  go-check:
    name: Go Check
    needs: runner
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64"]') }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      # Self-hosted runners on one host share a user; a per-job HOME keeps tool installs apart.
      - name: Isolate HOME on self-hosted runners
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ inputs.working-directory }}

      - name: Test
        if: ${{ inputs.run-tests }}
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: ${{ inputs.run-tests }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ inputs.working-directory }}/coverage.out
          retention-days: 7
