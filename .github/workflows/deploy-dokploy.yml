name: Deploy Dokploy

on:
  workflow_call:
    inputs:
      environment_url:
        description: "The URL of the deployed environment (e.g. https://myapp.example.com)"
        required: true
        type: string
      sha:
        description: "Commit SHA to deploy (defaults to the triggering commit)"
        required: false
        type: string
        default: ""
    secrets:
      DOKPLOY_API_KEY:
        description: "Dokploy API key (can be set as org secret)"
        required: false
      APPLICATION_ID:
        required: true

permissions:
  contents: read
  deployments: write

jobs:
  # GitHub-hosted runner by default. When it cannot start, jobs run on the caller org's self-hosted runner.
  runner:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions: {}
    outputs:
      hosted: ${{ steps.probe.outputs.hosted }}
    steps:
      - id: probe
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: runner
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64"]') }}
    steps:
      # Self-hosted runners on one host share a user; a per-job HOME keeps tool installs and logins apart.
      - name: Isolate HOME on self-hosted runners
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5

      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v8
        env:
          INPUT_SHA: ${{ inputs.sha }}
        with:
          result-encoding: string
          script: |
            const sha = process.env.INPUT_SHA || context.sha;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: "production",
              required_contexts: [],
              // 不让 GitHub 顺手合并。默认 auto_merge 为 true，意思是「如果
              // 这个 ref 落后于默认分支，先把默认分支并进去」——而这里的 sha
              // 来自 workflow_run.head_sha，等部署真的触发时 main 往往已经又
              // 往前走了几个提交。于是 createDeployment 直接回 409
              // "Conflict merging main into <sha>"，整个部署作业失败，而且失
              // 败原因和被部署的代码毫无关系。
              //
              // 部署记录本来也不该导致一次合并。
              auto_merge: false,
            });
            return String(deployment.data.id);

      - name: Trigger Dokploy Deployment
        id: dokploy
        run: |
          curl -X "POST" \
            "https://app.jianyuelab.org/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{ "applicationId": "${{ secrets.APPLICATION_ID }}" }'

      - name: Update Deployment Status
        if: success()
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
          ENVIRONMENT_URL: ${{ inputs.environment_url }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success",
              environment_url: process.env.ENVIRONMENT_URL,
            });

      - name: Update Deployment Status (Failed)
        if: failure()
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "failure",
            });
