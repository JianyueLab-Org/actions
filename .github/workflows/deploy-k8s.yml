name: Deploy Kubernetes

# 出镜像，然后滚一次 Deployment，并且和 deploy-dokploy.yml 一样留下一条
# GitHub Deployment 记录。
#
# 为什么不复用 deploy-dokploy.yml：那边是把一个 application_id POST 给 Dokploy，
# 由它去拉源码构建；这边的产物是一个镜像，部署动作是 `kubectl set image` +
# 等 rollout。两者只有「留部署记录」这一段是一样的。
#
# ---------------------------------------------------------------------------
# 关于集群凭据
# ---------------------------------------------------------------------------
#
# 用 KUBECONFIG_B64：一份 base64 过的 kubeconfig，组织级 secret，和别的 JYL
# 项目一致。整份 kubeconfig 比拆成 server/CA/token 三个 secret 省事，而且换集
# 群入口时只动一个值。
#
# 注意人手上那份 kubeconfig **不能直接拿来用**：它走 Omni 的 OIDC
# （kubectl-oidc_login），要点浏览器。CI 那份得是非交互可用的凭据。
#
# GHCR_PULL_TOKEN 用来在目标 namespace 里建/更新 ghcr-pull —— 集群里已有的应
# 用就是这么拉私有包的（见 llm-web 的 imagePullSecrets）。包是公开的话可以不设。

on:
  workflow_call:
    inputs:
      image:
        description: "镜像名，不含 tag（例如 ghcr.io/jianyuelab-org/can-dev）"
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        type: string
      deployment:
        description: "Deployment 名"
        required: false
        type: string
        default: "app"
      container:
        description: "要换镜像的容器名"
        required: false
        type: string
        default: "app"
      environment_url:
        description: "部署后的地址，写进 GitHub Deployment 记录"
        required: true
        type: string
      manifest:
        description: "先 apply 的清单路径。留空则只换镜像（要求资源已存在）"
        required: false
        type: string
        default: ""
      bun-version:
        required: false
        type: string
        default: "1.3"
    secrets:
      KUBECONFIG_B64:
        description: "base64 编码的 kubeconfig（组织级 secret）"
        required: false
      GHCR_PULL_TOKEN:
        description: "拉 GHCR 私有包用的 token，用来在 namespace 里建 ghcr-pull"
        required: false

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先跑一遍门禁再进 docker build —— 后者慢得多，格式或类型错了不必走到那步。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha 是回滚时唯一能指名道姓的东西；latest 只是给第一次 apply 用的
          # 方便标签。集群里跑的永远是 sha 那个。
          tags: |
            ${{ inputs.image }}:${{ github.sha }}
            ${{ inputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "production",
              required_contexts: [],
              // 见 deploy-dokploy.yml 里同一行的注释：默认 true 会让 GitHub
              // 先把默认分支并进来，ref 落后时直接 409。
              auto_merge: false,
            });
            return String(deployment.data.id);

      # 声明成 required: true 的 secret 一旦缺失，整个 run 会 startup_failure，
      # 界面上只写「workflow file issue」，看不出是哪个 secret —— 所以改成在这
      # 里显式检查，让失败说人话。
      # 声明成 required: true 的 secret 一旦缺失，整个 run 会 startup_failure，
      # 界面上只写「workflow file issue」、日志一行都拿不到 —— 所以改成在这里
      # 显式检查，让失败说人话。
      - name: Check cluster credentials
        run: |
          if [ -z "${{ secrets.KUBECONFIG_B64 }}" ]; then
            echo "::error::缺少 KUBECONFIG_B64（组织级 secret；注意 org secret 的可见性要包含本仓库）"
            exit 1
          fi

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      # 私有包才需要。公开包设了也无害，只是多一个用不上的 secret。
      - name: Ensure image pull secret
        if: ${{ secrets.GHCR_PULL_TOKEN != '' }}
        run: |
          kubectl -n "${{ inputs.namespace }}" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_PULL_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 先 apply 再换镜像：光 set image 要求 Deployment 已经存在，第一次部署
      # 或者 namespace 被删过之后就会直接失败。apply 是幂等的，两种情况一样走。
      - name: Apply manifests
        if: inputs.manifest != ''
        run: kubectl apply -f "${{ inputs.manifest }}"

      - name: Roll out
        run: |
          kubectl -n "${{ inputs.namespace }}" set image \
            "deploy/${{ inputs.deployment }}" \
            "${{ inputs.container }}=${{ inputs.image }}:${{ github.sha }}"
          # --timeout 让「一直起不来」变成一次失败，而不是把 job 挂到超时。
          kubectl -n "${{ inputs.namespace }}" rollout status \
            "deploy/${{ inputs.deployment }}" --timeout=300s

      - name: Update Deployment Status (Success)
        if: success()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
          ENVIRONMENT_URL: ${{ inputs.environment_url }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success",
              environment_url: process.env.ENVIRONMENT_URL,
            });

      - name: Update Deployment Status (Failed)
        if: failure()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
        with:
          script: |
            if (!process.env.DEPLOYMENT_ID) return;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "failure",
            });
