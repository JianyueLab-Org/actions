name: Deploy Kubernetes

# 出镜像，然后滚一次 Deployment，并且和 deploy-dokploy.yml 一样留下一条
# GitHub Deployment 记录。
#
# 为什么不复用 deploy-dokploy.yml：那边是把一个 application_id POST 给 Dokploy，
# 由它去拉源码构建；这边的产物是一个镜像，部署动作是 `kubectl set image` +
# 等 rollout。两者只有「留部署记录」这一段是一样的。
#
# ---------------------------------------------------------------------------
# 关于集群凭据
# ---------------------------------------------------------------------------
#
# 用 KUBECONFIG_B64：一份 base64 过的 kubeconfig，组织级 secret，和别的 JYL
# 项目一致。整份 kubeconfig 比拆成 server/CA/token 三个 secret 省事，而且换集
# 群入口时只动一个值。
#
# 注意人手上那份 kubeconfig **不能直接拿来用**：它走 Omni 的 OIDC
# （kubectl-oidc_login），要点浏览器。CI 那份得是非交互可用的凭据。
#
# GHCR_PULL_TOKEN 用来在目标 namespace 里建/更新 ghcr-pull —— 集群里已有的应
# 用就是这么拉私有包的（见 llm-web 的 imagePullSecrets）。包是公开的话可以不设。

on:
  workflow_call:
    inputs:
      image:
        description: "镜像名，不含 tag（例如 ghcr.io/jianyuelab-org/can-dev）"
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        type: string
      deployment:
        description: "Deployment 名"
        required: false
        type: string
        default: "app"
      container:
        description: "要换镜像的容器名"
        required: false
        type: string
        default: "app"
      environment_url:
        description: "部署后的地址，写进 GitHub Deployment 记录"
        required: true
        type: string
      manifest:
        description: "先 apply 的清单路径。留空则只换镜像（要求资源已存在）"
        required: false
        type: string
        default: ""
      bun-version:
        required: false
        type: string
        default: "1.3"
      fetch-depth:
        description: >-
          checkout 取多少个提交。默认 1（只要构建，历史用不上）。
          构建产物依赖 git 历史时传 0 —— 见下面 checkout 那一步的注释。
        required: false
        type: number
        default: 1
    secrets:
      KUBECONFIG_B64:
        description: "base64 编码的 kubeconfig（组织级 secret）"
        required: false
      GHCR_PULL_TOKEN:
        description: "拉 GHCR 私有包用的 token，用来在 namespace 里建 ghcr-pull"
        required: false

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 默认的 fetch-depth: 1 对绝大多数仓库是对的：构建只看工作区，多拉历史是白
      # 花时间。但**产物里含 git 历史的站点**不一样 —— can-docs 的每篇文档在页脚
      # 显示「最后更新」，那个时间戳是 VitePress 拿 `git log` 逐个文件问出来的。
      # 浅克隆下仓库里只有一个提交，于是它不是拿不到日期，而是**拿到错的**：每一
      # 页都显示本次部署的时间，一条几个月没动过的规章写着「今天更新」。
      #
      # 所以这里做成输入而不是直接改默认值：只有需要的仓库多付那一次全量 fetch。
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      # 先跑一遍门禁再进 docker build —— 后者慢得多，格式或类型错了不必走到那步。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      # can-ui 装在 GitHub Packages 上，而 GitHub 的 npm registry **即使是公开包
      # 也要求带令牌** —— 这是 GitHub 的规矩。各站的 .npmrc 写的是
      # `//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}`，那个变量在安装时才
      # 从环境里读，所以必须在这里显式喂进去：Actions 不会自动把 GITHUB_TOKEN
      # 放进 env。
      #
      # 缺了这一行的表现是 `bun install` 报 401，而不是「少了个环境变量」——
      # 而且是六个站同时红，因为它们共用这份工作流。
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run lint

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha 是回滚时唯一能指名道姓的东西；latest 只是给第一次 apply 用的
          # 方便标签。集群里跑的永远是 sha 那个。
          tags: |
            ${{ inputs.image }}:${{ github.sha }}
            ${{ inputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 容器里也要装依赖，而 build 阶段拿不到上面那个 env。用 BuildKit 的
          # secret 挂载而不是 --build-arg：build-arg 会留在镜像的层历史里，
          # `docker history` 就能读出来，等于把令牌焊进了一个推上 GHCR 的公开
          # 镜像。secret 挂载只在那条 RUN 存在期间可见，不进层。
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "production",
              required_contexts: [],
              // 见 deploy-dokploy.yml 里同一行的注释：默认 true 会让 GitHub
              // 先把默认分支并进来，ref 落后时直接 409。
              auto_merge: false,
            });
            return String(deployment.data.id);

      # 声明成 required: true 的 secret 一旦缺失，整个 run 会 startup_failure，
      # 界面上只写「workflow file issue」，看不出是哪个 secret —— 所以改成在这
      # 里显式检查，让失败说人话。
      # 声明成 required: true 的 secret 一旦缺失，整个 run 会 startup_failure，
      # 界面上只写「workflow file issue」、日志一行都拿不到 —— 所以改成在这里
      # 显式检查，让失败说人话。
      - name: Check cluster credentials
        run: |
          if [ -z "${{ secrets.KUBECONFIG_B64 }}" ]; then
            echo "::error::缺少 KUBECONFIG_B64（组织级 secret；注意 org secret 的可见性要包含本仓库）"
            exit 1
          fi

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      # 先 apply 再换镜像：光 set image 要求 Deployment 已经存在，第一次部署
      # 或者 namespace 被删过之后就会直接失败。apply 是幂等的，两种情况一样走。
      - name: Apply manifests
        if: inputs.manifest != ''
        run: kubectl apply -f "${{ inputs.manifest }}"

      # 私有包才需要。公开包设了也无害，只是多一个用不上的 secret。
      #
      # 判断放在 run 里而不是 if：`secrets` 上下文在 step 的 if: 里**不可用**，
      # 写了会让整个可复用工作流解析失败 —— 而调用方看到的报错是
      # "error parsing called workflow"，完全指不到这一行。
      - name: Ensure image pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "GHCR_PULL_TOKEN 未设置，跳过（包是公开的就不需要）"
            exit 0
          fi
          kubectl -n "${{ inputs.namespace }}" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Roll out
        run: |
          kubectl -n "${{ inputs.namespace }}" set image \
            "deploy/${{ inputs.deployment }}" \
            "${{ inputs.container }}=${{ inputs.image }}:${{ github.sha }}"
          # --timeout 让「一直起不来」变成一次失败，而不是把 job 挂到超时。
          kubectl -n "${{ inputs.namespace }}" rollout status \
            "deploy/${{ inputs.deployment }}" --timeout=300s

      - name: Update Deployment Status (Success)
        if: success()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
          ENVIRONMENT_URL: ${{ inputs.environment_url }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success",
              environment_url: process.env.ENVIRONMENT_URL,
            });

      - name: Update Deployment Status (Failed)
        if: failure()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
        with:
          script: |
            if (!process.env.DEPLOYMENT_ID) return;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "failure",
            });
